services:
  app:
    image: bloglist-front
    build:
      context: ./bloglist-frontend
      dockerfile: Dockerfile
    volumes:
      - ./bloglist-frontend:/usr/src/app
      - /usr/src/app/node_modules
    container_name: bloglist-front-dev

  server:
    image: bloglist-back
    build:
      context: ./bloglist-backend
      dockerfile: Dockerfile
    volumes:
      - ./bloglist-backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - MONGODB_URI=mongodb://mongo:27017/bloglist
      - TEST_MONGODB_URI=mongodb://mongo:27017/bloglist-test
      - SECRET=A8kX2mQ9pL5vN7rT1cY4hJ6wF0zS3uD8eG2nP9bV5xR1
      - PORT=3000

  mongo:
    image: mongo
    volumes:
      - ./bloglist-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      - ./mongo_data:/data/db

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app
      - server